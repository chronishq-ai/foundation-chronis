name: Synthetic Harness Stress Test

# Runs the synthetic data pipeline's stress-config test (elevated
# corruption rates, per spec Section 4.1) on a schedule, so pipeline
# robustness is proven regularly against heavy mess, not just the low
# default corruption rates every normal CI run exercises.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # allow manual trigger from the Actions tab

jobs:
  stress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run stress-config synthetic pipeline test
        run: poetry run pytest tests/test_stress_config.py -v

      - name: Run full synthetic test suite (sanity, non-stress)
        run: poetry run pytest tests/ -v -k "not test_stress_config"
